<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered History</title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
    
</head>
<body>
    <div class="image-container">
        <div class="layer" id="old-image">
            <img src="images/historic-tracks.jpg" alt="Historic tracks 1904">
        </div>

        <div class="layer" id="middle-image">
            <img src="images/city-hall-subway.jpg" alt="City Hall 1956">
        </div>

        <div class="layer" id="new-image">
            <img src="images/subway-entrance.jpg" alt="Modern entrance 2024">
        </div>
    </div>

    <div class="text" id="text-1">
        <p>History doesn't repeat...</p>
    </div>

    <div class="text" id="text-2">
        <p>Layers of time</p>
    </div>

    <div class="text" id="text-3">
        <p>...but it often rhymes.</p>
    </div>

    <div class="scroll-hint" id="hint">
        <p>↓ Scroll to explore ↓</p>
    </div>

</body>
</html>
